tro{max-width:510px;font-size:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}.join-card{box-shadow:0 24px 60px #0002}.tabs{display:flex;gap:4px;background:#0f2018;padding:5px;border-radius:13px;margin-bottom:24px}.tabs button{flex:1;border:0;background:none;min-height:43px;padding:8px}.tabs button[aria-selected=true]{background:#355040;color:var(--lime)}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}input{display:block;width:100%;background:#10221a;color:var(--text);border:1px solid #4b6756;border-radius:11px;padding:14px;margin-bottom:20px;min-width:0}input::placeholder{color:#8fa699}input.code{letter-spacing:5px;text-transform:uppercase}.full{width:100%}.small{font-size:13px}.center{text-align:center}.stats{display:flex;gap:30px;margin-top:32px}.stats strong{display:block;color:var(--text);font-size:23px}.stats span{font-size:12px;color:var(--muted)}.categories{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.pill{padding:7px 12px;border:1px solid var(--line);border-radius:30px;font-size:12px;color:var(--muted)}.how{padding:28px 0 38px;border-top:1px solid var(--line)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.step{display:flex;gap:13px}.step b{color:var(--lime);font-size:13px}.step p{margin:0;font-size:14px;color:var(--muted)}.step strong{display:block;color:var(--text);margin-bottom:4px}footer{padding:22px 0;color:var(--muted);border-top:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:12px}.linkbtn{border:0;padding:0;min-height:32px;background:none!important;color:var(--lime);font-size:13px}.roomhead{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:36px 0 24px}.roomhead h2{margin:3px 0}.roomcode{letter-spacing:5px;font-size:25px;font-weight:800}.roomlayout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:24px;margin-bottom:36px}.question{padding:36px;min-height:440px}.question h2{font-size:clamp(24px,3vw,36px);line-height:1.25;margin:24px 0 30px}.questiontop{display:flex;justify-content:space-between;align-items:center;gap:16px}.timer{border:1px solid var(--line);border-radius:40px;padding:7px 15px;min-width:67px;text-align:center;font-variant-numeric:tabular-nums;font-weight:750}.timer.urgent{color:var(--red)}.progress{height:4px;background:#375142;border-radius:5px;margin-top:18px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);width:100%;transition:width .2s linear}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{display:flex;align-items:center;text-align:left;gap:12px;padding:15px;min-height:74px;background:#12261c}.answer span{border:1px solid var(--line);border-radius:8px;width:29px;height:29px;flex-shrink:0;display:grid;place-items:center;font-size:13px;color:var(--muted)}.answer.selected{border-color:var(--lime);background:#344626;opacity:1}.answer.correct{border-color:var(--lime);background:#344626;opacity:1}.answer.wrong{border-color:var(--red);opacity:1}.feedback{border-radius:12px;background:#10241a;padding:18px;margin-top:24px}.feedback p{margin:5px 0}.board{padding:24px;align-self:start}.board h3{margin:0}.boardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.scorelist{list-style:none;margin:0;padding:0}.scorelist li{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.scorelist li:last-child{border:0}.rank{color:var(--muted);width:22px;text-align:center;font-variant-numeric:tabular-nums}.avatar{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;background:#35533d;color:var(--lime);font-weight:800;flex-shrink:0}.playername{flex:1;min-width:0;overflow-wrap:anywhere}.points{font-weight:750;font-variant-numeric:tabular-nums}.playerstatus{font-size:11px;color:var(--muted)}.lobby-title{margin:35px 0 12px!important}.invite{padding:24px;border:1px dashed #6b8053;border-radius:16px;margi <body>
<div class="wrap"><header><div class="brand"><span class="mark" aria-hidden="true">5</span>TERRACE FIVE</div><span class="tag" id="connection"><span class="dot"></span>Football quiz night</span></header><div id="banner" role="status"></div><main id="app"></main><footer><span>Five categories. A little rivalry. A great game.</span><span>2–12 players · No account needed</span></footer></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">
// Optional: paste your Firebase WEB config here. No service account or private keys.
// On Firebase Hosting, the app also discovers /__/firebase/init.json automatically.
const FIREBASE_CONFIG = null;
const SDK_VERSION='12.7.0';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)||''}catch{return ''}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let room=null,code='',uid='',demo=false,choice=null,busy=false,api=null,off=null,connectionOff=null,offsetOff=null,offset=0,lastSync=0,tab='create',viewKey='',syncing=false,connected=true,demoQuestions=[],demoAnswers={};
function toast(message){$('toast').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',5000)}
function banner(message,error=false){$('banner').className=message?'notice'+(error?' error':''):'';$('banner').textContent=message}
function session(value){try{if(value===null)sessionStorage.removeItem('terrace-room');else if(value)sessionStorage.setItem('terrace-room',value);else return sessionStorage.getItem('terrace-room')}catch{return null}}
function home(){viewKey='';$('app').innerHTML=`<section class="hero"><div><p class="eyebrow">Your matchday starts here</p><h1>Big football<br>energy.<br><em>Five rounds.</em></h1><p class="intro muted">Bring your friends. Back your football knowledge. Take your place at the top of the table.</p><div class="stats"><div><strong>5</strong><span>QUICK ROUNDS</span></div><div><strong>20s</strong><span>PER QUESTION</span></div><div><strong>1</strong><span>WINNING TABLE</span></div></div><div class="categories">${['Top scorers','Club history','Stadiums','Managers','Champions'].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="card join-card"><div class="tabs" role="tablist" aria-label="Room action"><button id="createTab" role="tab" aria-selected="${tab==='create'}">Create a room</button><button id="joinTab" role="tab" aria-selected="${tab==='join'}">Join a room</button></div><h2>${tab==='create'?'Kick off a quiz.':'Your team is waiting.'}</h2><p class="muted small">${tab==='create'?'You host. Your friends bring the competition.':'Enter the six-character code from your host.'}</p><form id="entry"><label for="name">Your display name</label><input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Captain Alex" value="${esc(store.get('terrace-name'))}" required>${tab==='join'?'<label for="codeInput">Room code</label><input id="codeInput" class="code" maxlength="6" minlength="6" placeholder="ABC234" autocomplete="off" autocapitalize="characters" spellcheck="false" required>':''}<button id="submit" class="primary full">${tab==='create'?'Create room →':'Join the game →'}</button></form><p class="muted small center spacer">Free to join · No sign-up · Play on any device</p><button class="linkbtn full" id="practice">Try a solo practice game</button></div></section><section class="how"><p class="eyebrow">From room code to bragging rights</p><div class="steps"><div class="step"><b>01</b><p><strong>Get everyone in.</strong>Share a room code. Each player joins on their own device.</p></div><div class="step"><b>02</b><p><strong>Lock in your answer.</strong>One question per category. 20 seconds. Your first answer is final.</p></div><div class="step"><b>03</b><p><strong>Climb the table.</strong>100 points per correct answer. Scores appear after each round. Ties share a rank.</p></div></div></section>`;
 $('createTab').onclick=()=>{tab='create';home()};$('joinTab').onclick=()=>{tab='join';home()};$('practice').onclick=startDemo;
 $('entry').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const button=$('submit');button.disabled=true;button.textContent='Connecting…';const name=$('name').value.trim();store.set('terrace-name',name);try{await connect();const result=await call(tab==='create'?'create':'join',{name,code:tab==='join'?$('codeInput').value.trim().toUpperCase():undefined});await attach(result.code);banner('');}catch(err){banner(friendly(err),true)}finally{busy=false;if(!room)home()}};
}
function friendly(e){if(e.code==='functions/internal')return 'The server could not complete that request. Please retry.';return e.message||'Connection failed. Please try again.'}
async function connect(){if(api){uid=api.uid;offset=api.offset||0;return}let config=FIREBASE_CONFIG;if(!config){try{const response=await fetch('/__/firebase/init.json');if(response.ok)config=await response.json()}catch{}}
 if(!config?.apiKey||!config?.databaseURL)throw new Error('Online rooms are not connected yet. Try solo practice, or deploy with the included Firebase setup guide.');
 const base=`https://www.gstatic.com/firebasejs/${SDK_VERSION}/`;
 const [appLib,authLib,dbLib,fnLib]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-database.js','firebase-functions.js'].map(p=>import(base+p)));
 const app=appLib.getApps()[0]||appLib.initializeApp(config),auth=authLib.getAuth(app),db=dbLib.getDatabase(app),fn=fnLib.getFunctions(app,'us-central1');
 if(['localhost','127.0.0.1'].includes(location.hostname)&&new URLSearchParams(location.search).get('emulator')==='1'){
  authLib.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});dbLib.connectDatabaseEmulator(db,'127.0.0.1',9000);fnLib.connectFunctionsEmulator(fn,'127.0.0.1',5001);
 }
 await authLib.setPersistence(auth,authLib.browserLocalPersistence);await auth.authStateReady();if(!auth.currentUser)await authLib.signInAnonymously(auth);uid=auth.currentUser.uid;
 api={...dbLib,db,uid,offset:0,request:fnLib.httpsCallable(fn,'game')};
 offsetOff=api.onValue(api.ref(db,'.info/serverTimeOffset'),s=>{api.offset=s.val()||0;if(!demo)offset=api.offset});
 connectionOff=api.onValue(api.ref(db,'.info/connected'),s=>{connected=!!s.val();if(demo)return;$('connection').textContent=connected?'● Connected':'Reconnecting…';if(!connected&&room)banner('Connection interrupted. Your first submitted answer remains locked; reconnecting…');else if(room)banner('')});
}
async function call(action,data={}){return (await api.request({action,code,...data})).data}
async function attach(roomCode){code=roomCode;demo=false;session(code);off?.();off=api.onValue(api.ref(api.db,'rooms/'+code+'/public'),snap=>{if(!snap.exists()){banner('This room has closed. Create a new room.',true);exitRoom(false);return}const next=snap.val();if(!room||room.round!==next.round||room.gameId!==next.gameId)choice=null;room=next;render()},e=>{banner('Your room expired or access was lost. Return home to create a new room.',true);exitRoom(false)});lastSync=0}
function rows(){return Object.entries(room.players).sort((a,b)=>b[1].score-a[1].score||a[1].name.localeCompare(b[1].name))}
function board(){let last=-1,rank=0;return `<aside class="card board"><div class="boardhead"><h3>${room.status==='lobby'?'The line-up':'Live table'}</h3><span class="pill">${Object.keys(room.players).length}/12</span></div><ol class="scorelist">${rows().map(([id,p],i)=>{if(p.score!==last){rank=i+1;last=p.score}const online=demo||Date.now()+offset-p.lastSeen<45000;return `<li><span class="rank">${room.status==='lobby'?'·':rank}</span><span class="avatar" aria-hidden="true">${esc(p.name.slice(0,1).toUpperCase())}</span><div class="playername">${esc(p.name)}${id===uid?' <span class="small muted">(you)</span>':''}<div class="playerstatus">${id===room.host?'Host · ':''}${online?'Online':'Away'}${room.status==='question'&&room.submitted?.[id]?' · Answer locked':''}</div></div><span class="points">${p.score}</span></li>`}).join('')}</ol><p class="muted small spacer">100 points for a correct answer. Equal scores share a rank.</p></aside>`}
function render(){if(!room)return;const key=JSON.stringify({room:{...room,players:Object.fromEntries(Object.entries(room.players).map(([k,p])=>[k,{...p,lastSeen:demo?true:Date.now()+offset-p.lastSeen<45000}]))},choice,busy});if(key===viewKey)return;viewKey=key;
 const p=room;const isHost=p.host===uid;const claim=!isHost&&Date.now()+offset-p.players[p.host].lastSeen>=45000;
 let body='';
 if(p.status==='lobby')body=`<p class="eyebrow">The pre-match</p><h2 class="lobby-title">Good company.<br>Friendly competition.</h2><p class="muted">Invite at least one friend to join on another device. Everyone gets the same questions at the same time.</p><div class="invite"><p class="small muted">YOUR ROOM CODE</p><div class="roomcode">${esc(code)}</div><button id="copy" class="linkbtn">Copy invitation link</button></div><p class="small muted">5 rounds · 20 seconds each · One answer per player<br>After each round: 8 seconds of feedback and scores.</p>${isHost?'<button class="primary full" id="start">Start the match →</button>':'<p class="center muted">Waiting for the host to start…</p>'}${claim?'<button id="claim" class="full spacer">Become host</button>':''}`;
 else if(p.status==='finished'){const ranked=rows(),top=ranked[0][1].score,winners=ranked.filter(x=>x[1].score===top).map(x=>x[1].name);body=`<p class="eyebrow">Full time · Five rounds complete</p><div class="winner" aria-hidden="true">★</div><h2 class="winner-name">${esc(winners.join(' & '))}<br><span style="color:var(--lime)">${winners.length>1?'share the win.':'takes the title.'}</span></h2><p class="muted">${top} points. ${demo?'A good warm-up. Ready to challenge your friends?':'A match worth talking about.'}</p><div class="buttonrow">${demo?'<button class="primary" id="again">Practice again</button>':isHost?'<button class="primary" id="rematch">Play a rematch →</button>':'<p class="muted">Waiting for the host to choose a rematch.</p>'}${claim?'<button id="claim">Become host</button>':''}<button id="home">Back to home</button></div>`}
 else {const reveal=p.status==='reveal',locked=!!p.submitted?.[uid],result=p.result,outcome=result?.outcomes?.[uid];body=`<div class="rounddots" aria-label="Round ${p.round+1} of 5">${[0,1,2,3,4].map(i=>`<i class="${i<=p.round?'done':''}"></i>`).join('')}</div><div class="questiontop"><span class="eyebrow">${esc(p.question.category)}</span><span id="timer" class="timer" aria-label="Seconds remaining">20s</span></div><div class="progress" aria-hidden="true"><i id="bar"></i></div><h2>${esc(p.question.text)}</h2><div class="answers">${p.question.options.map((text,i)=>`<button class="answer ${reveal&&i===result.correct?'correct':reveal&&i===outcome?.choice?'wrong':i===choice?'selected':''}" data-answer="${i}" ${locked||reveal||busy||Date.now()+offset>=p.deadline?'disabled':''}><span>${'ABCD'[i]}</span>${esc(text)}${reveal&&i===result.correct?' ✓':''}</button>`).join('')}</div>${reveal?`<div class="feedback" role="status"><strong>${outcome?.correct?'Correct! +100 points':outcome?.choice===-1?'Time’s up. No answer submitted.':'Not this time. +0 points'}</strong><p class="small">${esc(result.explanation)}</p><a class="small" href="${esc(result.source)}" target="_blank" rel="noopener noreferrer">Check the source ↗</a></div><p class="small muted spacer">${p.round===4?'Final results':'Next round'} in <span id="nextTimer">8</span>s…</p>`:`<p class="small muted spacer" id="answerStatus" role="status">${locked?'Answer locked. Results appear when time runs out.':'Choose carefully — your first answer is final.'}</p>`}`;}
 $('app').innerHTML=`<div class="roomhead"><div><p class="eyebrow">${demo?'Solo practice · Not multiplayer':p.status==='lobby'?'Private room':'Match in progress'}</p><h2>${p.status==='lobby'?'Ready when you are.':p.status==='finished'?'The final whistle.':`Round ${p.round+1} <span class="muted">/ 5</span>`}</h2></div><div><span class="roomcode">${esc(code)}</span><br><button class="linkbtn" id="exit">Leave game</button></div></div><div class="roomlayout"><section class="card question">${body}</section>${board()}</div>`;
 $('exit').onclick=()=>exitRoom();if($('home'))$('home').onclick=()=>exitRoom();if($('copy'))$('copy').onclick=async()=>{const url=new URL(location.href);url.search='';url.searchParams.set('room',code);try{await navigator.clipboard.writeText(url.href);toast('Invitation link copied.')}catch{toast('Share this room code: '+code)}};
 for(const [id,action] of [['start','start'],['rematch','rematch'],['claim','claimHost']])if($(id))$(id).onclick=()=>act(action);
 if($('again'))$('again').onclick=startDemo;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
 tickClock();
}
async function act(action){if(busy)return;busy=true;render();try{await call(action)}catch(e){toast(friendly(e))}finally{busy=false;render()}}
async function answer(i){if(busy||room.status!=='question'||room.submitted?.[uid]||Date.now()+offset>=room.deadline)return;busy=true;choice=i;render();try{if(demo){demoAnswers[room.round]=i;room.submitted={[uid]:true};}else {await call('answer',{choice:i,round:room.round,gameId:room.gameId});if(room?.status==='question'){room.submitted=room.submitted||{};room.submitted[uid]=true}}}catch(e){choice=null;toast(friendly(e))}finally{busy=false;render()}}
function exitRoom(clear=true){off?.();off=null;room=null;code='';demo=false;choice=null;session(null);if(clear)banner('');$('connection').textContent='Football quiz night';home()}
function tickClock(){if(!room?.deadline)return;const remaining=Math.max(0,room.deadline-(Date.now()+offset));if($('timer')){$('timer').textContent=Math.ceil(remaining/1000)+'s';$('timer').classList.toggle('urgent',remaining<=5000)}if($('bar'))$('bar').style.width=(remaining/(room.status==='question'?20000:8000)*100)+'%';if($('nextTimer'))$('nextTimer').textContent=Math.ceil(remaining/1000);if(remaining===0&&room.status==='question'){document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);if($('answerStatus'))$('answerStatus').textContent='Time’s up. Waiting for the round result…'}}
// Practice questions are separate from the server's competitive question bank.
const practice=[
 {category:'Top scorers',text:'Which player is widely known as “CR7”?',options:['Cristiano Ronaldo','Wayne Rooney','Thierry Henry','Luis Suárez'],correct:0,explanation:'CR7 is Cristiano Ronaldo’s well-known nickname.',source:'https://www.uefa.com/uefachampionsleague/'},
 {category:'Club history',text:'Which city do Liverpool FC call home?',options:['London','Manchester','Liverpool','Leeds'],correct:2,explanation:'Liverpool FC are based in Liverpool, England.',source:'https://www.liverpoolfc.com/'},

 {category:'Managers',text:'What does a football manager typically select before kick-off?',options:['The referee','The weather','The starting line-up','The final score'],correct:2,explanation:'Managers select their team’s starting line-up.',source:'https://www.theifab.com/laws/latest/the-players/'},

function startDemo(){off?.();off=null;session(null);demo=true;uid='practice';code='PRACTICE';offset=0;choice=null;busy=false;demoAnswers={};demoQuestions=practice.map(q=>({...q}));room={host:uid,status:'question',round:0,gameId:'practice',deadline:Date.now()+20000,players:{practice:{name:store.get('terrace-name')||'You',score:0,lastSeen:Date.now()}},question:demoQuestions[0],submitted:{}};banner('Solo practice — scores stay on this device. Online rooms support 2–12 players.');$('connection').textContent='Practice mode';viewKey='';render()}
function advanceDemo(){while(room&&demo&&room.deadline&&Date.now()>=room.deadline){if(room.status==='question'){const q=demoQuestions[room.round],a=demoAnswers[room.round],correct=a===q.correct;room.players[uid].score+=correct?100:0;room.result={correct:q.correct,explanation:q.explanation,source:q.source,outcomes:{[uid]:{choice:a??-1,correct,points:correct?100:0}}};room.status='reveal';room.deadline+=8000;}else if(room.round===4){room.status='finished';delete room.deadline}else{room.round++;room.status='question';room.deadline+=20000;room.question=demoQuestions[room.round];room.submitted={};delete room.result;choice=null;}render()}}
setInterval(async()=>{tickClock();if(demo){advanceDemo();return}if(!room||!api||syncing)return;const now=Date.now(),due=room.deadline&&now+offset>=room.deadline;if(now-lastSync<(due?2000:15000))return;lastSync=now;syncing=true;try{await call('sync')}catch(e){if(connected)toast(friendly(e))}finally{syncing=false}},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastSync=0});
home();
const invitation=new URLSearchParams(location.search).get('room');if(invitation){tab='join';home();$('codeInput').value=invitation.toUpperCase().slice(0,6)}
const previous=session();if(previous&&!invitation){try{await connect();await call('join',{code:previous,name:store.get('terrace-name')||'Player'});await attach(previous)}catch{session(null);banner('Your previous room is unavailable. Start or join a new game.')}}
